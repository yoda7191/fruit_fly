# Alembic configuration for the developer command line, run from the repository root:
#   alembic -c backend/alembic.ini revision --autogenerate -m "describe the change"
#   alembic -c backend/alembic.ini upgrade head
# The database comes from FRUIT_FLY_DATABASE_URL (default: the local SQLite file).
# The application itself doesn't need this file: it migrates on startup (db.init_db).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s